services:
  mysql:
    image: mysql:8.0
    container_name: chewy-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: chewy_root_2024
      MYSQL_DATABASE: chewy_pet
      MYSQL_USER: chewy_user
      MYSQL_PASSWORD: chewy_pass_2024
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2-alpine
    container_name: chewy-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:
  redis_data:
