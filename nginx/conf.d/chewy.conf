# ==================== 前台商城 端口 80 ====================
server {
    listen 80;
    server_name _;

    # 前台 SPA
    location / {
        proxy_pass http://chewy-storefront:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SPA fallback
        proxy_intercept_errors on;
        error_page 404 = @fallback;
    }

    location @fallback {
        proxy_pass http://chewy-storefront:3000;
    }

    # API 反向代理 → Gateway
    location /api/ {
        proxy_pass http://chewy-gateway:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # 健康检查
    location /health {
        return 200 'OK';
        add_header Content-Type text/plain;
    }
}

# ==================== 管理后台 端口 9000 ====================
server {
    listen 9000;
    server_name _;

    # 管理后台 SPA
    location / {
        proxy_pass http://chewy-admin:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_intercept_errors on;
        error_page 404 = @admin_fallback;
    }

    location @admin_fallback {
        proxy_pass http://chewy-admin:3001;
    }

    # 管理 API → Gateway（带 /admin 前缀鉴权）
    location /api/ {
        proxy_pass http://chewy-gateway:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
    }

    # 健康检查
    location /health {
        return 200 'OK';
        add_header Content-Type text/plain;
    }
}
