server:
  port: 8080

spring:
  application:
    name: chewy-pet-backend
  datasource:
    url: jdbc:mysql://localhost:3306/chewy_pet?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC
    username: root
    password: root123
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: localhost
      port: 6379

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

jwt:
  secret: ChewyPetStore2024SecretKey!@#$%^&*XyZ9mN3pQrStUvWb
  expiration: 86400000

payment:
  stripe:
    secret-key: ${STRIPE_SECRET_KEY:sk_test_placeholder}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:whsec_placeholder}
    success-url: http://localhost:3000/payment/success
    cancel-url: http://localhost:3000/payment/cancel
  paypal:
    client-id: ${PAYPAL_CLIENT_ID:paypal_client_placeholder}
    client-secret: ${PAYPAL_CLIENT_SECRET:paypal_secret_placeholder}
    mode: sandbox
