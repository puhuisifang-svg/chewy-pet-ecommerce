version: "3.9"

networks:
  backend-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
  frontend-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.21.0.0/16

volumes:
  mysql_data:
  redis_data:
  nacos_data:

services:

  # ==================== 基础设施层 ====================

  chewy-mysql:
    image: mysql:8.0
    container_name: chewy-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-chewy_root_2024}
      MYSQL_DATABASE: chewy_pet
      MYSQL_USER: chewy_user
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-chewy_pass_2024}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/migrations:/docker-entrypoint-initdb.d
    networks:
      - backend-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-chewy_root_2024}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  chewy-redis:
    image: redis:7.2-alpine
    container_name: chewy-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-chewy_redis_2024}
    networks:
      - backend-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-chewy_redis_2024}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  nacos:
    image: nacos/nacos-server:v2.3.0
    container_name: chewy-nacos
    restart: unless-stopped
    environment:
      MODE: standalone
      SPRING_DATASOURCE_PLATFORM: mysql
      MYSQL_SERVICE_HOST: chewy-mysql
      MYSQL_SERVICE_PORT: 3306
      MYSQL_SERVICE_DB_NAME: nacos_config
      MYSQL_SERVICE_USER: chewy_user
      MYSQL_SERVICE_PASSWORD: ${MYSQL_PASSWORD:-chewy_pass_2024}
      JVM_XMS: 256m
      JVM_XMX: 256m
    ports:
      - "8848:8848"
      - "9848:9848"
    volumes:
      - nacos_data:/home/nacos/data
    networks:
      - backend-network
    depends_on:
      chewy-mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8848/nacos/v1/console/health/readiness"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  # ==================== 微服务层 ====================

  chewy-gateway:
    build:
      context: ./services/gateway
      dockerfile: Dockerfile
    image: chewy/gateway:latest
    container_name: chewy-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      NACOS_SERVER_ADDR: chewy-nacos:8848
      REDIS_HOST: chewy-redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-chewy_redis_2024}
    networks:
      - backend-network
      - frontend-network
    depends_on:
      nacos:
        condition: service_healthy
      chewy-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  chewy-user-service:
    build:
      context: ./services/user-service
      dockerfile: Dockerfile
    image: chewy/user-service:latest
    container_name: chewy-user-service
    restart: unless-stopped
    environment:
      NACOS_SERVER_ADDR: chewy-nacos:8848
      MYSQL_HOST: chewy-mysql
      MYSQL_DB: chewy_pet
      MYSQL_USER: chewy_user
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-chewy_pass_2024}
      REDIS_HOST: chewy-redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-chewy_redis_2024}
      JWT_SECRET: ${JWT_SECRET:-ChewyPetStore2024SecretKey!@#$%^&*XyZ9mN3pQrStUvWb}
    networks:
      - backend-network
    depends_on:
      chewy-mysql:
        condition: service_healthy
      nacos:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  chewy-product-service:
    build:
      context: ./services/product-service
      dockerfile: Dockerfile
    image: chewy/product-service:latest
    container_name: chewy-product-service
    restart: unless-stopped
    environment:
      NACOS_SERVER_ADDR: chewy-nacos:8848
      MYSQL_HOST: chewy-mysql
      MYSQL_DB: chewy_pet
      MYSQL_USER: chewy_user
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-chewy_pass_2024}
      REDIS_HOST: chewy-redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-chewy_redis_2024}
    networks:
      - backend-network
    depends_on:
      chewy-mysql:
        condition: service_healthy
      nacos:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  chewy-order-service:
    build:
      context: ./services/order-service
      dockerfile: Dockerfile
    image: chewy/order-service:latest
    container_name: chewy-order-service
    restart: unless-stopped
    environment:
      NACOS_SERVER_ADDR: chewy-nacos:8848
      MYSQL_HOST: chewy-mysql
      MYSQL_DB: chewy_pet
      MYSQL_USER: chewy_user
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-chewy_pass_2024}
      REDIS_HOST: chewy-redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-chewy_redis_2024}
    networks:
      - backend-network
    depends_on:
      chewy-mysql:
        condition: service_healthy
      nacos:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  chewy-payment-service:
    build:
      context: ./services/payment-service
      dockerfile: Dockerfile
    image: chewy/payment-service:latest
    container_name: chewy-payment-service
    restart: unless-stopped
    environment:
      NACOS_SERVER_ADDR: chewy-nacos:8848
      MYSQL_HOST: chewy-mysql
      MYSQL_DB: chewy_pet
      MYSQL_USER: chewy_user
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-chewy_pass_2024}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-whsec_placeholder}
    networks:
      - backend-network
    depends_on:
      chewy-mysql:
        condition: service_healthy
      nacos:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8084/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  chewy-cart-service:
    build:
      context: ./services/cart-service
      dockerfile: Dockerfile
    image: chewy/cart-service:latest
    container_name: chewy-cart-service
    restart: unless-stopped
    environment:
      NACOS_SERVER_ADDR: chewy-nacos:8848
      REDIS_HOST: chewy-redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-chewy_redis_2024}
      MYSQL_HOST: chewy-mysql
      MYSQL_DB: chewy_pet
      MYSQL_USER: chewy_user
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-chewy_pass_2024}
    networks:
      - backend-network
    depends_on:
      chewy-redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8085/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  chewy-admin-service:
    build:
      context: ./services/admin-service
      dockerfile: Dockerfile
    image: chewy/admin-service:latest
    container_name: chewy-admin-service
    restart: unless-stopped
    environment:
      NACOS_SERVER_ADDR: chewy-nacos:8848
      MYSQL_HOST: chewy-mysql
      MYSQL_DB: chewy_pet
      MYSQL_USER: chewy_user
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-chewy_pass_2024}
      JWT_SECRET: ${JWT_SECRET:-ChewyPetStore2024SecretKey!@#$%^&*XyZ9mN3pQrStUvWb}
    networks:
      - backend-network
    depends_on:
      chewy-mysql:
        condition: service_healthy
      nacos:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8086/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ==================== 前端层 ====================

  chewy-storefront:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: chewy/storefront:latest
    container_name: chewy-storefront
    restart: unless-stopped
    networks:
      - frontend-network
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:3000/"]
      interval: 15s
      timeout: 5s
      retries: 3

  chewy-admin:
    build:
      context: ./admin-frontend
      dockerfile: Dockerfile
    image: chewy/admin:latest
    container_name: chewy-admin
    restart: unless-stopped
    networks:
      - frontend-network
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:3001/"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ==================== 接入层 ====================

  nginx:
    image: nginx:1.25-alpine
    container_name: chewy-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "9000:9000"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    networks:
      - frontend-network
    depends_on:
      - chewy-gateway
      - chewy-storefront
      - chewy-admin
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3
