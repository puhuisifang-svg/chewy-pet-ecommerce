version: '3.8'
# 基础设施：Nacos + MySQL + Redis
# 用法：docker-compose -f docker-compose-infra.yml up -d

services:
  nacos:
    image: nacos/nacos-server:v2.3.0
    container_name: chewy-nacos
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "false"
      JVM_XMS: 256m
      JVM_XMX: 256m
    ports:
      - "8848:8848"
      - "9848:9848"
    volumes:
      - nacos-data:/home/nacos/data
    networks:
      - chewy-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8848/nacos/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  mysql:
    image: mysql:8.0
    container_name: chewy-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: chewy_pet
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ../database/migrations:/docker-entrypoint-initdb.d
    networks:
      - chewy-net

  redis:
    image: redis:7-alpine
    container_name: chewy-redis
    ports:
      - "6379:6379"
    networks:
      - chewy-net

volumes:
  nacos-data:
  mysql-data:

networks:
  chewy-net:
    driver: bridge
