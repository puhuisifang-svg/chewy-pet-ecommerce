name: CI/CD Pipeline

on:
  push:
    branches: [develop]
  pull_request:
    branches: [main, develop]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ==================== 后端 CI ====================
  backend-build:
    name: Backend Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: cd backend && mvn clean package -DskipTests -q

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/target/*.jar
          retention-days: 1

  # ==================== 前端 CI ====================
  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Build frontend
        run: cd frontend && npm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 1

  # ==================== 管理后台 CI ====================
  admin-build:
    name: Admin Frontend Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check admin frontend exists
        id: check_admin
        run: |
          if [ -f "chewy-admin/package.json" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          elif [ -f "chewy-storefront/package.json" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "path=chewy-storefront" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Install and build admin
        if: steps.check_admin.outputs.exists == 'true'
        run: |
          ADMIN_PATH="${{ steps.check_admin.outputs.path || 'chewy-admin' }}"
          cd $ADMIN_PATH && npm ci && npm run build

  # ==================== 后端部署 ====================
  deploy-backend:
    name: Deploy Backend to Server
    runs-on: ubuntu-latest
    needs: [backend-build]
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-jar
          path: backend/target/

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Upload JAR to server
        run: |
          scp -i ~/.ssh/id_rsa backend/target/*.jar \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/opt/chewy-pet-ecommerce/backend/target/

      - name: Restart backend service
        run: |
          ssh -i ~/.ssh/id_rsa ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} bash << 'EOF'
            set -e
            echo "=== Stopping old backend ==="
            pkill -f 'chewy-pet-backend.*\.jar' || true
            sleep 3

            echo "=== Starting new backend ==="
            mkdir -p /var/log/chewy
            nohup java -jar /opt/chewy-pet-ecommerce/backend/target/chewy-pet-backend-*.jar \
              --spring.profiles.active=prod \
              > /var/log/chewy/backend.log 2>&1 &

            echo "=== Waiting for startup (max 60s) ==="
            for i in $(seq 1 12); do
              sleep 5
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/api/products?page=1&size=1 2>/dev/null)
              if [ "$STATUS" = "200" ]; then
                echo "✅ Backend started successfully (attempt $i)"
                exit 0
              fi
              echo "⏳ Attempt $i: HTTP $STATUS"
            done
            echo "❌ Backend failed to start in time"
            tail -30 /var/log/chewy/backend.log
            exit 1
          EOF

  # ==================== 前端部署 ====================
  deploy-frontend:
    name: Deploy Frontend to Server
    runs-on: ubuntu-latest
    needs: [frontend-build]
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy frontend via rsync
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/id_rsa" \
            frontend/dist/ \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/opt/chewy-pet-ecommerce/frontend/dist/

      - name: Reload Nginx
        run: |
          ssh -i ~/.ssh/id_rsa ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
            "nginx -t && nginx -s reload && echo '✅ Nginx reloaded'"
