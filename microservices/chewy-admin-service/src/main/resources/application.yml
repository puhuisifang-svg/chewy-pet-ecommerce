server:
  port: 8086

spring:
  application:
    name: chewy-admin-service
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:3306/chewy_pet?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root123}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER:127.0.0.1:8848}
        namespace: chewy-pet

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

jwt:
  secret: ChewyPetStore2024SecretKey!@#$%^&*XyZ9mN3pQrStUvWb
  expiration: 86400000

logging:
  level:
    com.chewy: DEBUG
